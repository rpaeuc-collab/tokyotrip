<head>

  <title>Bubu & Dudu：秋日東京之旅</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-warm: #FDF6EC;
      --ink-brown: #5E3826;
      --bubu-brown: #C39072;
      --bubu-cheek: #F9D57E;
      --dudu-white: #FFFFFF;
      --dudu-cheek: #F8B8BE;
      --bag-yellow: #FFD524;
      --maple-orange: #E86F2C;
      --maple-red: #D64531;
      --gold-accent: #F4A938;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background-color: var(--bg-warm);
      color: var(--ink-brown);
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1.5deg); }
    }

    @keyframes walkBob {
      0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
      50% { transform: translateY(-5px) rotate(1.5deg); }
    }

    @keyframes steamRise {
      0% { opacity: 0; transform: translateY(4px) scale(0.9); }
      50% { opacity: 0.85; transform: translateY(-6px) scale(1); }
      100% { opacity: 0; transform: translateY(-16px) scale(1.1); }
    }

    @keyframes sparklePulse {
      0%, 100% { opacity: 0.35; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    @keyframes leafDrift {
      0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(-25px, 120px) rotate(240deg); opacity: 0; }
    }

    @keyframes heartPop {
      0% { transform: scale(0.4) translateY(0); opacity: 0; }
      50% { transform: scale(1.2) translateY(-18px); opacity: 1; }
      100% { transform: scale(1) translateY(-34px); opacity: 0; }
    }

    @keyframes leafFlashOnce {
      0% { filter: brightness(1) drop-shadow(0 0 0 rgba(255, 245, 175, 0)); }
      45% { filter: brightness(1.75) drop-shadow(0 0 10px rgba(255, 240, 140, 0.95)); }
      100% { filter: brightness(1) drop-shadow(0 0 0 rgba(255, 245, 175, 0)); }
    }

    .anim-walk {
      animation: walkBob 0.75s ease-in-out infinite;
    }

    .anim-float {
      animation: floatSlow 2.6s ease-in-out infinite;
    }

    .anim-steam-1 {
      animation: steamRise 2.2s ease-out infinite;
    }

    .anim-steam-2 {
      animation: steamRise 2.2s ease-out 0.9s infinite;
    }

    .anim-sparkle {
      animation: sparklePulse 1.6s ease-in-out infinite;
    }

    .leaf-interactive {
      cursor: pointer;
      /* Larger invisible hit area for mobile taps */
      touch-action: manipulation;
    }
    .leaf-interactive:hover,
    .leaf-interactive:active {
      animation: leafFlashOnce 0.45s ease-out 1;
    }
    /* Force flash on click via class (JS will add temporarily) */
    .leaf-flash {
      animation: leafFlashOnce 0.45s ease-out 1;
    }

    .kawaii-card {
      border: 3.5px solid #5E3826;
      box-shadow: 0 8px 0 #5E3826;
    }

    .kawaii-btn {
      border: 3px solid #5E3826;
      box-shadow: 0 4px 0 #5E3826;
      transition: all 0.12s ease;
      min-height: 44px; /* iOS recommended touch target */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .kawaii-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #5E3826;
    }
    .kawaii-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #5E3826;
    }
    .kawaii-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .speech-bubble {
      position: relative;
      background: #FFFDF9;
      border: 3px solid #5E3826;
      border-radius: 1.25rem;
      box-shadow: 0 4px 0 rgba(94, 56, 38, 0.2);
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 11px 10px 0;
      border-style: solid;
      border-color: #5E3826 transparent transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#FDF6EC] text-[#5E3826] selection:bg-[#FFD524] selection:text-[#5E3826]">

  <!-- Top Navigation & Story Progress Header -->
  <header class="w-full max-w-4xl mx-auto px-4 pt-4 pb-2 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-2xl bg-[#C39072] border-[3px] border-[#5E3826] flex items-center justify-center shadow-[0_3px_0_#5E3826]">
        <span class="text-lg">🐻</span>
      </div>
      <div>
        <h1 class="text-lg sm:text-xl font-bold tracking-tight leading-none text-[#5E3826]">Bubu &amp; Dudu</h1>
        <p class="text-xs font-medium text-[#8C6249]">東京旅行 × 甜蜜大作戰</p>
      </div>
    </div>

    <!-- Dream Meter only (music button removed) -->
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1.5 bg-[#FFFDF9] px-2.5 sm:px-3 py-1.5 rounded-xl border-2 border-[#5E3826] text-[11px] sm:text-xs font-bold">
        <span>🍁</span>
        <span id="dream-progress-text">夢想 0%</span>
      </div>
    </div>
  </header>

  <!-- Main Interactive Storybook Stage (full-width illustration) -->
  <main class="w-full max-w-4xl mx-auto px-4 py-2 flex-1 flex flex-col justify-center">
    <div class="kawaii-card bg-[#FFFDF9] rounded-3xl overflow-hidden flex flex-col">
      
      <!-- Full-width Interactive Illustrated Stage -->
      <div class="relative w-full aspect-[4/4.2] sm:aspect-[4/3.6] min-h-[300px] bg-[#F7E5C8] overflow-hidden" id="stage-container">
        
        <!-- Dynamic SVG Canvas Scene -->
        <div id="scene-svg-wrapper" class="w-full h-full"></div>

        <!-- Floating Interactive Prompt Pill -->
        <div id="stage-hint-pill" class="absolute top-3 left-3 right-3 flex justify-between items-center pointer-events-none">
          <span class="bg-[#FFFDF9]/95 border-2 border-[#5E3826] px-3 py-1 rounded-full text-xs font-bold shadow-[0_2px_0_#5E3826] text-[#5E3826]" id="scene-badge">
            第 1 幕 · 努力搬運中
          </span>
          <span id="mini-task-counter" class="bg-[#FFD524] border-2 border-[#5E3826] px-3 py-1 rounded-full text-xs font-bold shadow-[0_2px_0_#5E3826] text-[#5E3826]">
            🍁 0 / 3
          </span>
        </div>

        <!-- Floating Heart/Toast Feedback Layer -->
        <div id="floating-effects-layer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

        <!-- Bottom floating controls (actions + navigation) -->
        <div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-[#5E3826]/25 to-transparent pointer-events-none">
          <div class="pointer-events-auto bg-[#FFFDF9]/95 border-2 border-[#5E3826] rounded-2xl p-2.5 shadow-[0_4px_0_#5E3826]">
            <!-- Action buttons (populated by JS) -->
            <div id="custom-action-area" class="flex flex-wrap justify-center gap-2 mb-2">
              <!-- Populated dynamically per scene -->
            </div>
            <!-- Navigation -->
            <div class="flex items-center justify-between gap-2">
              <button id="prev-btn" onclick="prevScene()" class="kawaii-btn bg-[#F5E6D3] hover:bg-[#EDD6B9] px-3 py-2 rounded-xl font-bold text-xs sm:text-sm text-[#5E3826] flex items-center gap-1">
                <span>←</span>
                <span>上一幕</span>
              </button>
              <button id="next-btn" onclick="nextScene()" class="kawaii-btn bg-[#FFD524] hover:bg-[#FFE055] px-4 py-2 rounded-xl font-bold text-xs sm:text-sm text-[#5E3826] flex-1 flex items-center justify-center gap-1">
                <span id="next-btn-text">下一幕</span>
                <span>→</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Hidden elements kept for JS compatibility (not displayed) -->
      <div class="hidden">
        <div id="chapter-subtitle"></div>
        <div id="chapter-title"></div>
        <div id="chapter-story"></div>
        <div id="task-emoji"></div>
        <div id="task-title"></div>
        <div id="task-instruction"></div>
        <div id="task-status-badge"></div>
        <div id="task-lock-hint"></div>
        <div id="interactive-box"></div>
      </div>

    </div>
  </main>


  <footer class="w-full max-w-4xl mx-auto px-4 py-3 text-center text-xs text-[#8C6249] font-medium space-y-1">
    <p>📱 手機專用：直接點擊畫面中的秋葉、角色與按鈕即可互動</p>
    <p>點擊角色或物件有驚喜音效 · Bubu &amp; Dudu Interactive Story</p>
  </footer>

  <script>
    // ==========================================
    // 1. AUDIO ENGINE (Web Audio / Tone.js)
    // ==========================================
    let soundEnabled = false;
    let synth = null;
    let bgLoop = null;

    async function initAudio() {
      if (synth) return;
      await Tone.start();
      synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 0.03, decay: 0.25, sustain: 0.2, release: 0.8 }
      }).toDestination();
      synth.volume.value = -12;

      const melody = [
        { note: "C5", dur: "4n", time: "0:0" },
        { note: "E5", dur: "4n", time: "0:1" },
        { note: "G5", dur: "4n", time: "0:2" },
        { note: "A5", dur: "4n", time: "0:3" },
        { note: "G5", dur: "2n", time: "1:0" },
        { note: "E5", dur: "2n", time: "1:2" },
        { note: "F5", dur: "4n", time: "2:0" },
        { note: "E5", dur: "4n", time: "2:1" },
        { note: "D5", dur: "4n", time: "2:2" },
        { note: "C5", dur: "4n", time: "2:3" },
        { note: "D5", dur: "1m", time: "3:0" }
      ];

      bgLoop = new Tone.Part((time, val) => {
        if (soundEnabled && synth) {
          synth.triggerAttackRelease(val.note, val.dur, time);
        }
      }, melody);
      bgLoop.loop = true;
      bgLoop.loopEnd = "4m";
      Tone.Transport.bpm.value = 96;
    }

    async function toggleSound() {
      await initAudio();
      soundEnabled = !soundEnabled;
      const icon = document.getElementById("sound-icon");
      const label = document.getElementById("sound-label");
      if (soundEnabled) {
        Tone.Transport.start();
        bgLoop.start(0);
        icon.textContent = "🎵";
        label.textContent = "音樂開";
        playPopSound("G5");
      } else {
        Tone.Transport.pause();
        icon.textContent = "🔇";
        label.textContent = "音樂關";
      }
    }

    function playPopSound(note = "E5") {
      if (!soundEnabled || !synth) return;
      try {
        synth.triggerAttackRelease(note, "16n");
      } catch (e) {}
    }

    function playFanfare() {
      if (!soundEnabled || !synth) return;
      const now = Tone.now();
      synth.triggerAttackRelease("C5", "8n", now);
      synth.triggerAttackRelease("E5", "8n", now + 0.12);
      synth.triggerAttackRelease("G5", "8n", now + 0.24);
      synth.triggerAttackRelease("C6", "2n", now + 0.36);
    }

    // ==========================================
    // 2. CHARACTER DESIGN HELPERS (Exact Two-Bear Artwork Style)
    // Bubu: Warm milk-chocolate brown bear (#C39072), #5E3826 outline,
    //       soft yellow-orange cheeks (#F9D57E), ω mouth, bright yellow crossbody bag (#FFD524)
    // Dudu: White panda bear (#FFFFFF), dark brown panda ears & bow tie (#5E3826),
    //       soft rosy pink cheeks (#F8B8BE), ω mouth
    // ==========================================
    function renderBubuCharacter({ x = 180, y = 240, scale = 1, pose = "box", mood = "determined", leafOnHead = false, walking = true }) {
      const walkClass = walking ? "anim-walk" : "";
      let eyesMarkup = "";
      let mouthMarkup = "";

      if (mood === "determined") {
        // Determined eyebrows + cute round eyes + ω mouth
        eyesMarkup = `
          <circle cx="-24" cy="-8" r="5.5" fill="#5E3826"/>
          <circle cx="24" cy="-8" r="5.5" fill="#5E3826"/>
          <path d="M -32 -18 L -18 -13" stroke="#5E3826" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M 32 -18 L 18 -13" stroke="#5E3826" stroke-width="3.2" stroke-linecap="round"/>
        `;
        mouthMarkup = `<path d="M -6 0 Q -3 5 0 0 Q 3 5 6 0" fill="none" stroke="#5E3826" stroke-width="2.8" stroke-linecap="round"/>`;
      } else if (mood === "yawn") {
        eyesMarkup = `
          <path d="M -30 -8 Q -24 -13 -18 -8" fill="none" stroke="#5E3826" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M 18 -8 Q 24 -13 30 -8" fill="none" stroke="#5E3826" stroke-width="3.2" stroke-linecap="round"/>
        `;
        mouthMarkup = `<ellipse cx="0" cy="7" rx="9" ry="12" fill="#E36A6A" stroke="#5E3826" stroke-width="2.8"/>`;
      } else if (mood === "tired") {
        eyesMarkup = `
          <circle cx="-24" cy="-6" r="5" fill="#5E3826"/>
          <circle cx="24" cy="-6" r="5" fill="#5E3826"/>
          <path d="M -32 -12 L -17 -15" stroke="#5E3826" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M 32 -12 L 17 -15" stroke="#5E3826" stroke-width="2.8" stroke-linecap="round"/>
        `;
        mouthMarkup = `<path d="M -5 5 Q 0 1 5 5" fill="none" stroke="#5E3826" stroke-width="2.8" stroke-linecap="round"/>`;
      } else if (mood === "happy") {
        eyesMarkup = `
          <path d="M -30 -6 Q -24 -14 -18 -6" fill="none" stroke="#5E3826" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M 18 -6 Q 24 -14 30 -6" fill="none" stroke="#5E3826" stroke-width="3.5" stroke-linecap="round"/>
        `;
        mouthMarkup = `<path d="M -6 0 Q -3 5 0 0 Q 3 5 6 0" fill="none" stroke="#5E3826" stroke-width="2.8" stroke-linecap="round"/>`;
      } else if (mood === "love") {
        eyesMarkup = `
          <circle cx="-24" cy="-7" r="5.5" fill="#5E3826"/>
          <circle cx="24" cy="-7" r="5.5" fill="#5E3826"/>
          <circle cx="-26" cy="-9" r="1.8" fill="#FFFFFF"/>
          <circle cx="22" cy="-9" r="1.8" fill="#FFFFFF"/>
        `;
        mouthMarkup = `<path d="M -6 0 Q -3 5 0 0 Q 3 5 6 0" fill="none" stroke="#5E3826" stroke-width="2.8" stroke-linecap="round"/>`;
      }

      const leafBadge = leafOnHead ? `
        <g transform="translate(0, -56) rotate(-14)">
          <path d="M 0 -14 C 10 -6, 12 6, 0 14 C -12 6, -10 -6, 0 -14 Z" fill="#E86F2C" stroke="#5E3826" stroke-width="2.5"/>
          <path d="M 0 -10 L 0 16" stroke="#5E3826" stroke-width="2" stroke-linecap="round"/>
        </g>
      ` : "";

      let extraArmsAndProps = "";
      if (pose === "box") {
        extraArmsAndProps = `
          <!-- Cardboard box held by Bubu -->
          <g transform="translate(-14, 24)">
            <rect x="-46" y="-26" width="76" height="58" rx="6" fill="#D5B189" stroke="#5E3826" stroke-width="3.5"/>
            <rect x="-46" y="-26" width="22" height="58" rx="4" fill="#C49D74" stroke="#5E3826" stroke-width="3.5"/>
            <line x1="-24" y1="-10" x2="30" y2="-10" stroke="#5E3826" stroke-width="2.5"/>
            <!-- Bubu's little paw gripping box -->
            <path d="M 16 2 C 30 2, 32 18, 16 18" fill="#C39072" stroke="#5E3826" stroke-width="3.5" stroke-linecap="round"/>
          </g>
        `;
      } else if (pose === "typing") {
        extraArmsAndProps = `
          <ellipse cx="-24" cy="36" rx="11" ry="8" fill="#C39072" stroke="#5E3826" stroke-width="3.2"/>
          <ellipse cx="14" cy="38" rx="11" ry="8" fill="#C39072" stroke="#5E3826" stroke-width="3.2"/>
        `;
      } else if (pose === "propose") {
        extraArmsAndProps = `
          <!-- Ring box held out -->
          <g transform="translate(-54, 22)">
            <path d="M -14 -4 L 14 -4 L 12 12 L -12 12 Z" fill="#D64531" stroke="#5E3826" stroke-width="3"/>
            <path d="M -14 -4 C -14 -18, 14 -18, 14 -4 Z" fill="#E85D48" stroke="#5E3826" stroke-width="3"/>
            <circle cx="0" cy="-6" r="5" fill="#FFD524" stroke="#5E3826" stroke-width="2"/>
            <polygon points="0,-14 4,-9 0,-6 -4,-9" fill="#9EE7FF" stroke="#5E3826" stroke-width="1.5"/>
          </g>
          <path d="M -26 22 C -40 18, -44 30, -28 32" fill="#C39072" stroke="#5E3826" stroke-width="3.2" stroke-linecap="round"/>
        `;
      } else {
        extraArmsAndProps = `
          <!-- Left & Right Arms -->
          <path d="M -42 22 C -54 28, -50 42, -38 38" fill="#C39072" stroke="#5E3826" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M 42 22 C 55 26, 56 38, 42 36" fill="#C39072" stroke="#5E3826" stroke-width="3.5" stroke-linecap="round"/>
        `;
      }

      return `
        <g transform="translate(${x}, ${y}) scale(${scale})" class="cursor-pointer" onclick="patBear('bubu')">
          <g class="${walkClass}">
            <!-- Ground shadow -->
            <ellipse cx="0" cy="68" rx="44" ry="11" fill="rgba(94, 56, 38, 0.16)"/>

            <!-- Chubby Legs -->
            <path d="M -28 50 L -28 63 C -28 69, -12 69, -12 63 L -12 52" fill="#C39072" stroke="#5E3826" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 12 52 L 12 63 C 12 69, 28 69, 28 63 L 28 50" fill="#C39072" stroke="#5E3826" stroke-width="3.5" stroke-linecap="round"/>

            <!-- Main Round Body & Head Silhouette (Milk-Chocolate Brown #C39072) -->
            <path d="M -46 -12 C -48 -46, -24 -56, 0 -56 C 24 -56, 48 -46, 46 -12 C 48 16, 48 54, 0 54 C -48 54, -48 16, -46 -12 Z" fill="#C39072" stroke="#5E3826" stroke-width="3.8"/>

            <!-- Cute Round Bear Ears with Darker Inner Ear -->
            <circle cx="-35" cy="-46" r="14" fill="#C39072" stroke="#5E3826" stroke-width="3.8"/>
            <circle cx="-35" cy="-46" r="7" fill="#7D4E38"/>
            <circle cx="35" cy="-46" r="14" fill="#C39072" stroke="#5E3826" stroke-width="3.8"/>
            <circle cx="35" cy="-46" r="7" fill="#7D4E38"/>

            <!-- Soft Yellow-Orange Blush Cheeks (#F9D57E from reference image) -->
            <ellipse cx="-32" cy="4" rx="11" ry="8.5" fill="#F9D57E" opacity="0.92"/>
            <ellipse cx="32" cy="4" rx="11" ry="8.5" fill="#F9D57E" opacity="0.92"/>

            <!-- Eyes & Mouth -->
            ${eyesMarkup}
            ${mouthMarkup}

            <!-- Signature Bright Yellow Crossbody Pouch (#FFD524) -->
            <path d="M -38 14 Q 0 38 38 34" fill="none" stroke="#FFD524" stroke-width="6.5" stroke-linecap="round"/>
            <path d="M -38 14 Q 0 38 38 34" fill="none" stroke="#5E3826" stroke-width="2.2" stroke-linecap="round"/>
            <g transform="translate(26, 36) rotate(-10)">
              <path d="M -13 -8 L 13 -8 C 14 4, 8 11, 0 11 C -8 11, -14 4, -13 -8 Z" fill="#FFD524" stroke="#5E3826" stroke-width="2.8"/>
              <path d="M -12 -8 Q 0 0 12 -8" fill="none" stroke="#5E3826" stroke-width="2.2"/>
            </g>

            <!-- Arms & Props -->
            ${extraArmsAndProps}

            <!-- Optional Autumn Leaf on Head -->
            ${leafBadge}
          </g>
        </g>
      `;
    }

    function renderDuduCharacter({ x = 290, y = 240, scale = 1, mood = "happy", leafOnHead = false, walking = true }) {
      const walkClass = walking ? "anim-walk" : "";
      let eyesMarkup = "";
      let mouthMarkup = "";

      if (mood === "happy") {
        eyesMarkup = `
          <path d="M -29 -6 Q -23 -14 -17 -6" fill="none" stroke="#5E3826" stroke-width="3.5" stroke-linecap="round"/>

    function renderCurrentScene() {
      const s = scenes[currentSceneIndex];
      document.getElementById("scene-badge").textContent = s.badge;
      document.getElementById("chapter-subtitle").textContent = s.subtitle;
      document.getElementById("chapter-title").textContent = s.title;
      document.getElementById("chapter-story").innerHTML = s.story;
      document.getElementById("task-emoji").textContent = s.taskEmoji;
      document.getElementById("task-title").textContent = s.taskTitle;
      document.getElementById("task-instruction").innerHTML = s.taskInstruction;
      document.getElementById("next-btn-text").textContent = s.nextText;

      document.getElementById("prev-btn").disabled = currentSceneIndex === 0;
      const nextBtn = document.getElementById("next-btn");
      const taskCompleted = isSceneTaskCompleted(currentSceneIndex);
      nextBtn.disabled = !taskCompleted;

      const wrapper = document.getElementById("scene-svg-wrapper");
      if (wrapper) {
        if (currentSceneIndex === 0) wrapper.innerHTML = buildScene1SVG();
        else if (currentSceneIndex === 1) wrapper.innerHTML = buildScene2SVG();
        else if (currentSceneIndex === 2) wrapper.innerHTML = buildScene3SVG();
        else if (currentSceneIndex === 3) wrapper.innerHTML = buildScene4SVG();
        else if (currentSceneIndex === 4) wrapper.innerHTML = buildScene5Video();
      }

      updateProgressAndControls();
    }

    function isSceneTaskCompleted(sceneIdx) {
      if (sceneIdx === 0) return sceneState[0].leavesCollected >= sceneState[0].totalLeaves;
      if (sceneIdx === 1) return sceneState[1].workClicks >= sceneState[1].targetClicks;
      if (sceneIdx === 2) return sceneState[2].cheerCount >= sceneState[2].targetCheers;
      if (sceneIdx === 3) return sceneState[3].photoTaken && sceneState[3].leavesCaught >= 2;
      if (sceneIdx === 4) return sceneState[4].videoWatched;
      return false;
    }

      const nextBtn = document.getElementById("next-btn");

      let totalDone = 0;

    // Scene 5: Ring box video
    function buildScene5Video() {

    function completeVideoScene() {
      sceneState[4].videoWatched = true;
      playFanfare();
      spawnFloatingBadge("💖 永遠在一起！");
      renderCurrentScene();
    }

    function replayRingVideo() {
      const v = document.getElementById("ring-box-video");
      if (v) {
        v.currentTime = 0;
        v.muted = false;
        v.play();
      }
      playPopSound("E5");
    }

    // ==========================================
    // 5. INTERACTIVE HANDLERS & MINI-GAMES
    // ==========================================
    function spawnFloatingBadge(text, clientX = null, clientY = null) {
      const layer = document.getElementById("floating-effects-layer");
      const badge = document.createElement("div");
      badge.textContent = text;
      badge.className = "absolute font-black text-sm sm:text-base px-2.5 py-1 rounded-full bg-[#FFFDF9] border-2 border-[#5E3826] shadow-[0_3px_0_#5E3826] text-[#5E3826] pointer-events-none";
      badge.style.animation = "heartPop 1.1s ease-out forwards";

      const rect = layer.getBoundingClientRect();
      if (clientX && clientY) {
        badge.style.left = `${Math.max(16, Math.min(rect.width - 110, clientX - rect.left - 30))}px`;
        badge.style.top = `${Math.max(40, Math.min(rect.height - 50, clientY - rect.top - 20))}px`;
      } else {
        badge.style.left = `${35 + Math.random() * 30}%`;
        badge.style.top = `${45 + Math.random() * 15}%`;
      }

      layer.appendChild(badge);
      setTimeout(() => badge.remove(), 1100);
    }

    function patBear(who) {
      playPopSound(who === "bubu" ? "G5" : "A5");
      if (who === "bubu") {
        spawnFloatingBadge("🐻 薯仔兵布布加油！");
      } else {
        spawnFloatingBadge("🐼 一二最錫布布！");
      }
    }

    // Scene 1 Actions
    function collectScene1Leaf(idx) {
      const s = sceneState[0];
      if (!s.clickedLeaves[idx]) {
        s.clickedLeaves[idx] = true;
        s.leavesCollected++;
      } else if (s.leavesCollected < 3) {
        const nextIdx = s.clickedLeaves.indexOf(false);
        if (nextIdx !== -1) {
          s.clickedLeaves[nextIdx] = true;
          s.leavesCollected++;
        }
      }
      playPopSound("E5");
      spawnFloatingBadge(`🍁 秋葉 +1 (${s.leavesCollected}/3)`);
      renderCurrentScene();
    }

    // Scene 2 Actions
    function typeForTokyo() {
      const s = sceneState[1];
      s.workClicks = Math.min(5, s.workClicks + 1);
      playPopSound("C5");
      spawnFloatingBadge(s.workClicks >= 5 ? "🎯 東京旅費存滿啦！" : "⌨️ 噠噠噠... 努力工作中！");
      renderCurrentScene();
    }

    function sipCoffee() {
      playPopSound("G5");
      spawnFloatingBadge("☕ 暖呼呼咖啡能量 +100！");
    }

    // Scene 3 Actions
    function cheerBubuUp() {
      const s = sceneState[2];
      s.cheerCount = Math.min(3, s.cheerCount + 1);
      if (s.cheerCount >= 2) s.leafCaught = true;
      playPopSound("A5");
      spawnFloatingBadge(s.cheerCount >= 3 ? "💛 布布充滿電啦！" : "🤝 牽手好溫暖～");
      renderCurrentScene();
    }

    function toggleDuduLeaf() {
      sceneState[2].leafCaught = !sceneState[2].leafCaught;
      playPopSound("F5");
      spawnFloatingBadge("🍁 頭頂長出小秋葉！");
      renderCurrentScene();
    }

    // Scene 4 Actions
    function takeFujiPhoto() {
      sceneState[3].photoTaken = true;
      playFanfare();
      spawnFloatingBadge("📸 喀嚓！富士山合照完成！");
      renderCurrentScene();
    }

    function showerMapleLeaves() {
      sceneState[3].leavesCaught = Math.min(2, sceneState[3].leavesCaught + 1);
      playPopSound("E5");
      spawnFloatingBadge(`🍁 紅葉 +1 (${Math.min(2, sceneState[3].leavesCaught)}/2)`);
      renderCurrentScene();
    }

    // ==========================================
    // 6. NAVIGATION & INIT
    // ==========================================
    function goToScene(index) {
      if (index < 0 || index >= scenes.length) return;
      if (index > currentSceneIndex && !isSceneTaskCompleted(currentSceneIndex)) {
        playPopSound("D5");
        spawnFloatingBadge("🔒 請先完成本幕任務！");
        return;
      }
      currentSceneIndex = index;
      playPopSound("E5");
      renderCurrentScene();
    }

    function nextScene() {
      if (!isSceneTaskCompleted(currentSceneIndex)) {
        playPopSound("D5");
        spawnFloatingBadge("🔒 仲未完成任務，唔可以跳去下一幕喎！");
        return;
      }
      if (currentSceneIndex < scenes.length - 1) {
        goToScene(currentSceneIndex + 1);
      } else {
        // Final scene completed
        playFanfare();
        spawnFloatingBadge("💖 幸福圓滿！東京夢想達成啦～");
      }
    }

    function prevScene() {
      if (currentSceneIndex > 0) {
        goToScene(currentSceneIndex - 1);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderCurrentScene();
    });
  </script>
